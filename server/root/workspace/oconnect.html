<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OConnect | Local File Network</title>
    <style>
        :root {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-card-hover: #21262d;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-muted: #8b949e;
            --accent-cyan: #58a6ff;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --bg-sidebar: #0f141c;
            --accent-contrast: #000000;
            --radius: 8px;
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --border-color: #dbe2ea;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --accent-cyan: #0891b2;
            --accent-green: #15803d;
            --accent-red: #dc2626;
            --bg-sidebar: #f8fafc;
            --accent-contrast: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .oconnect-container { display: flex; width: 100%; max-width: 1000px; height: 80vh; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .oconnect-sidebar { width: 320px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; background: var(--bg-sidebar); }
        .sidebar-header { margin-bottom: 20px; }
        .sidebar-header h2 { font-size: 1.4rem; color: var(--text-primary); margin-bottom: 8px; }
        .sidebar-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .theme-toggle { padding: 4px 10px; font-size: 0.9rem; line-height: 1; }

        .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.05); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-red); transition: background 0.3s; }
        .status-dot.connected { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .controls { display: flex; gap: 8px; margin: 15px 0; }
        .btn { flex: 1; padding: 8px 12px; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: 0.2s opacity; font-size: 0.85rem; }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--accent-cyan); color: var(--accent-contrast); }
        .btn-danger { background: var(--accent-red); color: #fff; }
        .btn-secondary { background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border-color); }

        .user-list-container { flex: 1; overflow-y: auto; margin-top: 10px; }
        .user-list-header { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 10px; }
        
        .user-item { padding: 12px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; transition: 0.2s; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .user-item:hover { background: var(--bg-card-hover); }
        .user-item.selected { background: var(--bg-card-hover); border-color: var(--accent-cyan); }
        .user-item .user-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--bg-card-hover); padding: 2px 6px; border-radius: 4px; }

        .oconnect-main { flex: 1; display: flex; flex-direction: column; padding: 25px; background: var(--bg-card); overflow-y: auto; }
        .main-header { font-size: 1.2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }

        .target-indicator { background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.3); padding: 12px; border-radius: var(--radius); margin-bottom: 20px; color: var(--accent-cyan); font-size: 0.9rem; }

        .select-zone { border: 2px dashed var(--border-color); border-radius: var(--radius); padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.2s; margin-bottom: 15px; background: rgba(255,255,255,0.01); }
        .select-zone:hover { border-color: var(--accent-cyan); background: rgba(88, 166, 255, 0.05); }

        .file-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .file-chip { background: var(--bg-card-hover); padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); }
        .file-chip .remove-btn { cursor: pointer; color: var(--accent-red); margin-left: 4px; font-weight: bold; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); width: 520px; max-width: 90%; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        .modal h4 { margin-bottom: 15px; font-size: 1.1rem; }

        /* File Picker UI Styling */
        .picker-breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; background: var(--bg-sidebar); padding: 8px 12px; border-radius: var(--radius); word-break: break-all; }
        .picker-list { height: 260px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--bg-sidebar); margin-bottom: 15px; }
        .picker-item { padding: 10px 14px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; cursor: pointer; }
        .picker-item:hover { background: var(--bg-card-hover); }
        .picker-item.selected { background: rgba(88, 166, 255, 0.15); border-left: 3px solid var(--accent-cyan); }
        
        .transfer-card { background: var(--bg-sidebar); border: 1px solid var(--border-color); padding: 12px; border-radius: var(--radius); margin-bottom: 10px; font-size: 0.85rem; }
        .transfer-card header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
        .transfer-actions { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
    </style>
</head>
<body>

    <div class="oconnect-container">
        <div class="oconnect-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <h2>OConnect</h2>
                    <button id="themeToggle" class="btn btn-secondary theme-toggle" type="button"></button>
                </div>
                <div class="status-badge">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>

            <div class="controls">
                <button id="btnConnect" class="btn btn-primary" onclick="networkConnect()">Connect</button>
                <button id="btnDisconnect" class="btn btn-danger" onclick="networkDisconnect()" disabled>Disconnect</button>
            </div>

            <hr style="border:0; border-top:1px solid var(--border-color); margin: 10px 0;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="user-list-header">Online Peers (<span id="userCount">0</span>)</div>
                <button class="btn btn-secondary btn-sm" onclick="fetchUserList()" style="padding: 2px 6px; font-size: 0.7rem;">Refresh</button>
            </div>
            <div class="user-list-container" id="userList">
                <div style="color: var(--text-muted); font-size: 0.85rem; padding: 10px;">Connect to view active network peers.</div>
            </div>
        </div>

        <div class="oconnect-main">
            <div class="main-header">
                <h3>Transfer Manager</h3>
            </div>

            <div class="target-indicator" id="selectedTargetDisplay">
                Target Peer: <strong>None Selected</strong> (Click a peer from the list)
            </div>

            <div class="select-zone" onclick="openFilePickerModal()">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    📁 Click to <span style="color: var(--accent-cyan); text-decoration: underline;">Browse Storage</span> for files to send
                </p>
            </div>

            <div class="file-preview" id="filePreview"></div>

            <button id="btnSend" class="btn btn-primary" onclick="sendFiles()" style="align-self: center; width: 100%; max-width: 150px; padding: 8px 0; font-size: 0.85rem;" disabled>
                Send Files
            </button>
        </div>
    </div>

    <!-- File Picker Modal -->
    <div class="modal-overlay" id="filePickerModal">
        <div class="modal">
            <h4>Select Files</h4>
            <div class="picker-breadcrumb" id="pickerBreadcrumb">Path: .</div>
            <div class="picker-list" id="pickerList"></div>
            <div class="transfer-actions">
                <button class="btn btn-secondary" onclick="closeFilePickerModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmFileSelection()">Select File</button>
            </div>
        </div>
    </div>

    <!-- Incoming Transfer Modal -->
    <div class="modal-overlay" id="transferModal">
        <div class="modal">
            <h4>Incoming File Offer</h4>
            <div id="transferContainer"></div>
            <div class="transfer-actions">
                <button class="btn btn-danger" onclick="respondToTransfers(false)">Reject All</button>
                <button class="btn btn-primary" onclick="respondToTransfers(true)">Accept Selected</button>
            </div>
        </div>
    </div>

    <script src="/static/theme.js"></script>
    <script src="/static/toasts.js"></script>
    <script src="/static/oconnect.js"></script>
</body>
</html>
